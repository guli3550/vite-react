<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9fa" />
    <title>GULI PREMIUM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/responsive-fixes.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const API=(location.hostname.includes('vercel.app')?'https://guli-lingerie-api.onrender.com':'').replace(/\/$/,'');
        let productsPromise=null;
        const loadProducts=()=>productsPromise||(productsPromise=fetch(`${API}/api/products?limit=100`).then(r=>r.json()).then(j=>Array.isArray(j.data)?j.data:[]).catch(()=>[]));
        const enhance=async(root)=>{
          const wrap=root.querySelector('.detailImageWrap');
          if(!wrap||wrap.dataset.galleryReady)return;
          const title=root.querySelector('.detailContent h1')?.textContent?.trim()||'';
          const code=(root.querySelector('.productCodeLabel')?.textContent||'').replace(/\D/g,'');
          if(!title&&!code)return;
          wrap.dataset.galleryReady='loading';
          const products=await loadProducts();
          const product=products.find(p=>(code&&String(p.product_code||'')===code)||(title&&String(p.name||'').trim()===title));
          if(!product){wrap.dataset.galleryReady='';return}
          const urls=[product.image,...(Array.isArray(product.images)?product.images:[])].filter(Boolean);
          if(urls.length<2){wrap.dataset.galleryReady='';return}
          const main=wrap.querySelector('img');
          if(!main){wrap.dataset.galleryReady='';return}
          let index=0;
          const gallery=document.createElement('div');
          gallery.className='guli-mini-gallery';
          gallery.style.cssText='display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none;touch-action:pan-x;';
          const buttons=[];
          const setImage=(i)=>{index=(i+urls.length)%urls.length;main.src=urls[index];buttons.forEach((b,n)=>{b.style.border=n===index?'2px solid #b95a70':'1px solid #eadde0';b.style.opacity=n===index?'1':'.75'});counter.textContent=`${index+1} / ${urls.length}`};
          urls.forEach((url,i)=>{const b=document.createElement('button');b.type='button';b.style.cssText='flex:0 0 68px;width:68px;height:82px;padding:0;border:1px solid #eadde0;border-radius:12px;overflow:hidden;background:#fff;';const im=document.createElement('img');im.src=url;im.alt=`Rasm ${i+1}`;im.style.cssText='width:100%;height:100%;object-fit:cover;display:block;';b.appendChild(im);b.addEventListener('click',()=>setImage(i));gallery.appendChild(b);buttons.push(b)});
          const nav=document.createElement('div');nav.style.cssText='display:flex;justify-content:center;align-items:center;gap:10px;margin-top:2px;';
          const prev=document.createElement('button');prev.type='button';prev.textContent='‹';prev.style.cssText='width:38px;height:38px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);font-size:24px;';
          const counter=document.createElement('span');counter.textContent=`1 / ${urls.length}`;counter.style.cssText='font-size:12px;font-weight:700;color:#9c6876;min-width:55px;text-align:center;';
          const next=document.createElement('button');next.type='button';next.textContent='›';next.style.cssText=prev.style.cssText;
          prev.addEventListener('click',()=>setImage(index-1));next.addEventListener('click',()=>setImage(index+1));nav.append(prev,counter,next);
          wrap.append(gallery,nav);
          const desc=root.querySelector('.detailContent .description');
          if(desc){desc.style.display='block';desc.style.whiteSpace='pre-wrap';desc.style.lineHeight='1.7';desc.style.marginTop='14px';}
          setImage(0);
          wrap.dataset.galleryReady='1';
        };
        const observer=new MutationObserver(()=>{const root=document.querySelector('.productDetail');if(root)enhance(root)});
        observer.observe(document.body,{childList:true,subtree:true});
        setTimeout(()=>{const root=document.querySelector('.productDetail');if(root)enhance(root)},700);
      })();
    </script>
  </body>
</html>
