name: One-time order phone hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unverified client phone fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/orderCreationIntegrityPatch.js')
          s = p.read_text()
          replacements = [
            ('orderPhone = String(tu?.telegram_phone || rawBody.phone || "").trim();', 'orderPhone = String(tu?.telegram_phone || "").trim();'),
          ]
          for old, new in replacements:
              if s.count(old) != 2:
                  raise SystemExit(f'Expected exactly 2 matches, found {s.count(old)}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Verify hardening
        run: |
          set -euo pipefail
          if grep -n 'rawBody\.phone' backend/orderCreationIntegrityPatch.js; then exit 1; fi
          node --check backend/orderCreationIntegrityPatch.js
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/orderCreationIntegrityPatch.js
          git rm .github/workflows/one-time-order-phone-hardening.yml
          git commit -m "fix(security): require verified phone for orders"
          git push
