name: GULI AI Hardening

on:
  push:
    branches:
      - audit/guli-ai-production-20260918

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden GULI AI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const pkgPath = 'backend/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          if (!pkg.dependencies || !pkg.dependencies['@google/genai']) throw new Error('Missing @google/genai dependency');
          pkg.dependencies['@google/genai'] = '^2.23.0';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const indexPath = 'backend/index.js';
          let index = fs.readFileSync(indexPath, 'utf8');
          if (!index.includes('app.set("trust proxy", 1);')) {
            index = index.replace('const app = express();', 'const app = express();\n\n// Render/Cloudflare reverse-proxy boundary: trust exactly one proxy hop.\napp.set("trust proxy", 1);');
          }
          fs.writeFileSync(indexPath, index);

          const aiPath = 'backend/adminAiChatRuntime.js';
          let ai = fs.readFileSync(aiPath, 'utf8');

          // Remove hard-coded operational demo data. A proxy intentionally throws if any legacy fallback path is reached.
          ai = ai.replace(/\/\/ Built-in GULI catalog and promo data[\s\S]*?const FALLBACK_PROMOS = \[[\s\S]*?\];\n\n/, [
            '// No operational demo/fallback data is permitted in GULI AI.\n',
            'const DB_UNAVAILABLE_ERROR = "Ma\'lumotlar bazasi vaqtinchalik ishlamayapti";\n',
            'function createDbUnavailableProxy() {\n',
            '  return new Proxy([], { get() { throw new Error(DB_UNAVAILABLE_ERROR); } });\n',
            '}\n',
            'const FALLBACK_PRODUCTS = createDbUnavailableProxy();\n',
            'const FALLBACK_PROMOS = createDbUnavailableProxy();\n\n',
          ].join(''));

          // Do not trust a client-supplied X-Forwarded-For chain. Express req.ip is derived from the configured proxy boundary.
          ai = ai.replace(/function getClientIp\(req\) \{[\s\S]*?\n\}/, [
            'function getClientIp(req) {',
            '  return String(req.ip || req.socket?.remoteAddress || "admin").trim() || "admin";',
            '}',
          ].join('\n'));

          // Make DB failures explicit and non-misleading wherever the old resilient fallback comments/logs occur.
          ai = ai.replace(/using resilient catalog fallback/g, 'database unavailable');
          ai = ai.replace(/Resilient store metrics fallback/g, 'Database unavailable');
          ai = ai.replace(/Resilient fallback inventory inspection/g, 'Database unavailable');
          ai = ai.replace(/resilient fallback inventory inspection/g, 'database unavailable');

          // Explicitly prevent wildcard order selection in the AI tool.
          ai = ai.replace(/\.from\("orders"\)\.select\("\*"\)/g, '.from("orders").select("id, order_number, status, total, items, created_at, payment_status, receipt_url")');

          // Keep only supported Gemini 3.x models; transcription remains separate.
          if (!ai.includes('"gemini-3.8-flash"')) throw new Error('Gemini 3.8 Flash missing');
          if (!ai.includes('"gemini-3.1-flash-lite"')) throw new Error('Gemini 3.1 Flash Lite missing');
          if (!ai.includes('"gemini-3.5-flash"')) throw new Error('Gemini 3.5 Flash missing');

          fs.writeFileSync(aiPath, ai);
          NODE

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Static security verification
        run: |
          set -euo pipefail
          test "$(node -p "require('./backend/package.json').dependencies['@google/genai']")" = "^2.23.0"
          ! grep -n 'GULI2026\|YANGI20\|BAHOR30K\|Velvet Elegance' backend/adminAiChatRuntime.js
          grep -n 'trust proxy' backend/index.js
          grep -n 'DB_UNAVAILABLE_ERROR' backend/adminAiChatRuntime.js
          ! grep -n 'select("\*")' backend/adminAiChatRuntime.js
          ! grep -n 'x-forwarded-for' backend/adminAiChatRuntime.js

      - name: Node syntax checks
        run: |
          set -euo pipefail
          node --check backend/adminAiChatRuntime.js
          node --check backend/index.js

      - name: Commit hardening changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json backend/index.js backend/adminAiChatRuntime.js
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "fix(security): harden GULI AI production runtime"
          git push origin HEAD:audit/guli-ai-production-20260918
