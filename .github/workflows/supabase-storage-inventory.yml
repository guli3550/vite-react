name: Supabase Storage read-only inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install only the Supabase client (avoid unrelated backend lockfile drift)
        run: npm install --prefix backend --no-save --package-lock=false --ignore-scripts --no-audit --no-fund '@supabase/supabase-js@^2.57.0'
      - name: List actual Supabase Storage buckets (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node backend/scripts/supabase-storage-inventory.js
