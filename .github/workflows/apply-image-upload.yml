name: Apply GULI image upload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-image-upload.yml'
      - 'tools/apply_image_upload.py'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[image-upload-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 tools/apply_image_upload.py

      - name: Verify changes
        run: |
          node --check backend/index.js
          npm install
          npm run build

      - name: Commit changes and clean up
        run: |
          git config user.name 'guli3550-bot'
          git config user.email 'guli3550-bot@users.noreply.github.com'
          rm -f .github/workflows/apply-image-upload.yml tools/apply_image_upload.py
          git add backend/index.js src/admin/AdminPro.tsx src/admin/AdminPro.css .github/workflows/apply-image-upload.yml tools/apply_image_upload.py
          git commit -m 'Add admin product image upload [image-upload-applied]'
          git push
