name: Apply orders customer avatar fix

on:
  push:
    branches:
      - fix/orders-customer-avatar

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orders-customer-avatar
          fetch-depth: 0
      - name: Patch AdminPro
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin/AdminPro.tsx')
          s = p.read_text()

          old_call = '''              <OrderTable
                rows={(dashboard?.recentOrders || []).slice(0, 8)}
                onOpen={(o) => setSelectedOrder(o)}
              />'''
          new_call = '''              <OrderTable
                rows={(dashboard?.recentOrders || []).slice(0, 8)}
                userPhotosMap={userPhotosMap}
                onOpen={(o) => setSelectedOrder(o)}
              />'''
          if old_call not in s:
              raise SystemExit('dashboard OrderTable call not found')
          s = s.replace(old_call, new_call, 1)

          old_customer = '''                      <td>
                        <b>{o.first_name || "Mijoz"}</b>
                        <small>
                          {o.username ? `@${o.username}` : o.phone || ""}
                        </small>
                      </td>'''
          new_customer = '''                      <td>
                        <div
                          style={{
                            display: "flex",
                            alignItems: "center",
                            gap: 9,
                            minWidth: 150,
                          }}
                        >
                          <div
                            style={{
                              width: 36,
                              height: 36,
                              borderRadius: "50%",
                              overflow: "hidden",
                              flexShrink: 0,
                              display: "grid",
                              placeItems: "center",
                              background: "#f8fafc",
                              border: "1.5px solid #be123c",
                              boxShadow: "0 2px 6px rgba(0,0,0,0.08)",
                            }}
                          >
                            {(userPhotosMap[o.telegram_id || 0] || o.telegram_photo || o.photo_url) ? (
                              <img
                                src={userPhotosMap[o.telegram_id || 0] || o.telegram_photo || o.photo_url}
                                alt={o.first_name || "Mijoz"}
                                style={{ width: "100%", height: "100%", objectFit: "cover" }}
                                onError={(e) => {
                                  (e.currentTarget as HTMLImageElement).style.display = "none";
                                }}
                              />
                            ) : (
                              <span style={{ fontSize: 13, fontWeight: 800, color: "#be123c" }}>
                                {(o.first_name || o.username || "G").slice(0, 1).toUpperCase()}
                              </span>
                            )}
                          </div>
                          <div style={{ minWidth: 0 }}>
                            <b style={{ display: "block", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                              {o.first_name || "Mijoz"}
                            </b>
                            <small>
                              {o.username ? `@${o.username}` : o.phone || ""}
                            </small>
                          </div>
                        </div>
                      </td>'''
          if old_customer not in s:
              raise SystemExit('orders customer cell not found')
          s = s.replace(old_customer, new_customer, 1)

          old_sig = '''function OrderTable({
  rows,
  onOpen,
}: {
  rows: any[];
  onOpen: (o: any) => void;
}) {'''
          new_sig = '''function OrderTable({
  rows,
  userPhotosMap,
  onOpen,
}: {
  rows: any[];
  userPhotosMap?: Record<number, string>;
  onOpen: (o: any) => void;
}) {'''
          if old_sig not in s:
              raise SystemExit('OrderTable signature not found')
          s = s.replace(old_sig, new_sig, 1)

          old_table_customer = '''              <td>{o.first_name || o.username || "Mijoz"}</td>'''
          new_table_customer = '''              <td>
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                  }}
                >
                  <div
                    style={{
                      width: 32,
                      height: 32,
                      borderRadius: "50%",
                      overflow: "hidden",
                      flexShrink: 0,
                      display: "grid",
                      placeItems: "center",
                      background: "#f8fafc",
                      border: "1.5px solid #be123c",
                    }}
                  >
                    {(userPhotosMap?.[o.telegram_id || 0] || o.telegram_photo || o.photo_url) ? (
                      <img
                        src={userPhotosMap?.[o.telegram_id || 0] || o.telegram_photo || o.photo_url}
                        alt={o.first_name || "Mijoz"}
                        style={{ width: "100%", height: "100%", objectFit: "cover" }}
                      />
                    ) : (
                      <span style={{ fontSize: 12, fontWeight: 800, color: "#be123c" }}>
                        {(o.first_name || o.username || "G").slice(0, 1).toUpperCase()}
                      </span>
                    )}
                  </div>
                  <span>{o.first_name || o.username || "Mijoz"}</span>
                </div>
              </td>'''
          if old_table_customer not in s:
              raise SystemExit('recent orders customer cell not found')
          s = s.replace(old_table_customer, new_table_customer, 1)

          p.write_text(s)
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/AdminPro.tsx .github/workflows/apply-orders-avatar-fix.yml
          git commit -m "fix(admin): show customer avatars in orders" || exit 0
          git rm .github/workflows/apply-orders-avatar-fix.yml
          git commit -m "chore: remove one-shot avatar patch workflow"
          git push origin fix/orders-customer-avatar
