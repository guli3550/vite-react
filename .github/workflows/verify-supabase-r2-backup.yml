name: Independently verify Supabase backup in private R2

on:
  workflow_dispatch:
    inputs:
      confirm_verify:
        description: "Type VERIFY-R2-BACKUP to authorize read-only verification"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-r2-backup-independent-verify
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ inputs.confirm_verify == 'VERIFY-R2-BACKUP' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout verification utility
        uses: actions/checkout@v4
        with:
          ref: chore/verify-supabase-r2-backup

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Independently verify manifest, object listing, sizes and SHA-256
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: guli-market-backup
          BACKUP_PREFIX: supabase-storage-backup/2026-11-24T07-03-47-483Z/
        run: node backend/scripts/verify-supabase-r2-backup.js

  reject-unconfirmed:
    if: ${{ inputs.confirm_verify != 'VERIFY-R2-BACKUP' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require exact confirmation
        run: |
          echo "Verification not started. Enter VERIFY-R2-BACKUP to authorize read-only checks."
          exit 1
