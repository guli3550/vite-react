name: Build GULI MARKET TWA APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/twa-android-wrapper

permissions:
  contents: read

jobs:
  twa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Bubblewrap core
        run: npm install --no-save @bubblewrap/core@latest @bubblewrap/cli@latest

      - name: Validate live PWA
        run: npx @bubblewrap/cli@latest validate --url=https://gulii.uz/

      - name: Generate TWA Android project
        run: node scripts/generate-twa-project.mjs

      - name: Build debug APK
        working-directory: twa-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guli-market-twa-debug-apk
          path: twa-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload generated Android project
        uses: actions/upload-artifact@v4
        with:
          name: guli-market-twa-android-project
          path: twa-android/
          if-no-files-found: error
