name: Build GULI MARKET TWA Release

on:
  workflow_dispatch:
    inputs:
      publish_assetlinks:
        description: "Generate assetlinks.json as a workflow artifact (does not deploy it)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.GULI_TWA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GULI_TWA_KEYSTORE_PASSWD }}
          KEY_PASSWORD: ${{ secrets.GULI_TWA_KEY_PASSWD || secrets.GULI_TWA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GULI_TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Missing GULI_TWA_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing GULI_TWA_KEYSTORE_PASSWD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing GULI_TWA_KEY_PASSWD (or legacy GULI_TWA_KEY_PASSWORD)"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing GULI_TWA_KEY_ALIAS"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Bubblewrap
        run: npm install --no-save @bubblewrap/core@latest @bubblewrap/cli@latest

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.GULI_TWA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android.keystore
          chmod 600 android.keystore
          echo "Keystore bytes: $(wc -c < android.keystore)"
          file android.keystore || true
          if ! keytool -list -keystore android.keystore -storepass "${{ secrets.GULI_TWA_KEYSTORE_PASSWD }}" >keytool-error.txt 2>&1; then
            echo "::error::The GULI_TWA_KEYSTORE_B64 value decoded, but the keystore could not be opened with GULI_TWA_KEYSTORE_PASSWD."
            cat keytool-error.txt
            exit 1
          fi

      - name: Read release certificate fingerprint
        id: cert
        env:
          STORE_PASSWORD: ${{ secrets.GULI_TWA_KEYSTORE_PASSWD }}
          KEY_ALIAS: ${{ secrets.GULI_TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          fingerprint="$(keytool -list -v -keystore android.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          test -n "$fingerprint" || { echo "::error::Unable to read SHA-256 certificate fingerprint"; exit 1; }
          echo "sha256=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Release certificate SHA-256: $fingerprint"

      - name: Generate TWA Android project
        run: node scripts/generate-twa-project.mjs

      - name: Prepare signing key in generated TWA project
        run: |
          set -euo pipefail
          cp android.keystore twa-android/android.keystore
          chmod 600 twa-android/android.keystore
          test -f twa-android/manifest-checksum.txt || {
            echo "::error::Generated TWA project is missing manifest-checksum.txt"
            ls -la twa-android
            exit 1
          }
          ls -la twa-android | sed -n '1,80p'

      - name: Configure Bubblewrap CI toolchain
        run: |
          set -euo pipefail

          # Bubblewrap expects its configured Android SDK root to contain
          # bin/ (or the legacy tools/ tree). setup-android keeps the
          # command-line tools under cmdline-tools/<version>/ and the rest
          # of the SDK at ANDROID_HOME. Build a real SDK facade so both
          # Bubblewrap validation and sdkmanager see a consistent root.
          bubblewrap_sdk="$RUNNER_TEMP/bubblewrap-android-sdk"
          rm -rf "$bubblewrap_sdk"
          mkdir -p "$bubblewrap_sdk"

          cmdline_tools_bin="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 3 -type f -name sdkmanager -print -quit)"
          test -n "$cmdline_tools_bin" || {
            echo "::error::Could not locate sdkmanager under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f | sed -n '1,80p'
            exit 1
          }
          cmdline_tools_root="$(dirname "$(dirname "$cmdline_tools_bin")")"

          ln -s "$cmdline_tools_bin" "$bubblewrap_sdk/bin"
          ln -s "$cmdline_tools_root/lib" "$bubblewrap_sdk/lib"

          for sdk_dir in build-tools platform-tools platforms licenses; do
            if [ -d "$ANDROID_HOME/$sdk_dir" ]; then
              ln -s "$ANDROID_HOME/$sdk_dir" "$bubblewrap_sdk/$sdk_dir"
            fi
          done

          test -x "$bubblewrap_sdk/bin/sdkmanager"
          test -d "$bubblewrap_sdk/lib"
          test -d "$bubblewrap_sdk/platform-tools"
          test -d "$bubblewrap_sdk/build-tools"

          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "$bubblewrap_sdk"
          }
          EOF

          echo "Bubblewrap CI config:"
          cat "$HOME/.bubblewrap/config.json"
          echo "SDK facade:"
          ls -la "$bubblewrap_sdk"
          java -version
          "$bubblewrap_sdk/bin/sdkmanager" --version

      - name: Build signed APK and AAB
        working-directory: twa-android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.GULI_TWA_KEYSTORE_PASSWD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.GULI_TWA_KEY_PASSWD || secrets.GULI_TWA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GULI_TWA_KEY_ALIAS }}
        run: |
          npx @bubblewrap/cli@latest build \
            --skipPwaValidation \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias="$KEY_ALIAS"

      - name: Generate Digital Asset Links
        if: ${{ inputs.publish_assetlinks }}
        env:
          GULI_ANDROID_PACKAGE: uz.gulii.market
          GULI_RELEASE_SHA256: ${{ steps.cert.outputs.sha256 }}
          GULI_PLAY_APP_SIGNING_SHA256: ${{ secrets.GULI_PLAY_APP_SIGNING_SHA256 }}
          GULI_ASSETLINKS_OUTPUT: twa-assetlinks/assetlinks.json
        run: node scripts/generate-assetlinks.mjs

      - name: Verify signed artifacts
        env:
          STORE_PASSWORD: ${{ secrets.GULI_TWA_KEYSTORE_PASSWD }}
          KEY_ALIAS: ${{ secrets.GULI_TWA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -f twa-android/app-release-signed.apk
          test -f twa-android/app-release-bundle.aab
          apksigner verify --verbose twa-android/app-release-signed.apk
          keytool -printcert -jarfile twa-android/app-release-signed.apk | grep -F "SHA256:" || true

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: guli-market-twa-release
          path: |
            twa-android/app-release-signed.apk
            twa-android/app-release-bundle.aab
            twa-android/twa-manifest.json
            twa-assetlinks/assetlinks.json
          if-no-files-found: error
