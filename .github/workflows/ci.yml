name: GULI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        run: npm install --prefix backend
      - name: Validate backend syntax
        run: |
          node --check backend/index.js
          node --check backend/customerServer.js
          node --check backend/customerIdentityPatch.js
