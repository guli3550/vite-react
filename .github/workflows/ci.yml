name: GULI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        run: npm install --prefix backend
      - name: Validate backend syntax
        run: node --check backend/index.js
      - name: Persist build-time source normalization
        if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore: product-code search')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source normalization changes needed."
            exit 0
          fi
          git add src/admin/AdminPro.tsx src/App.tsx
          git commit -m "chore: product-code search"
          git push
