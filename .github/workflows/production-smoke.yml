name: GULI Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Vercel production page
        shell: bash
        run: |
          set -euo pipefail
          url="https://vite-react-guli3550.vercel.app/?tgapp=smoke"
          code="$(curl -L -sS -o /tmp/vercel.html -w '%{http_code}' --max-time 30 "$url")"
          if [[ "$code" != "200" ]]; then
            echo "Vercel production is not publicly reachable: HTTP $code"
            head -c 1000 /tmp/vercel.html || true
            exit 1
          fi
          grep -q '<div id="root"></div>' /tmp/vercel.html
          echo "Vercel production page OK"

      - name: Check Render API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 https://guli-lingerie-api.onrender.com/api/health)"
          echo "$body"
          grep -q '"success":true' <<< "$body"
          grep -q '"status":"online"' <<< "$body"
          echo "Render health OK"

      - name: Check catalog API
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 'https://guli-lingerie-api.onrender.com/api/products?limit=1')"
          echo "$body" | head -c 2000
          grep -q '"success":true' <<< "$body"
          grep -q '"data":\[' <<< "$body"
          echo "Catalog API OK"

      - name: Check browser guest session
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 -X POST https://guli-lingerie-api.onrender.com/api/guest-session -H 'Content-Type: application/json')"
          echo "$body" | head -c 2000
          grep -q '"success":true' <<< "$body"
          grep -q '"token":"' <<< "$body"
          echo "Guest session API OK"

      - name: Check protected customer endpoints reject unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/orders.json -w '%{http_code}' --max-time 30 https://guli-lingerie-api.onrender.com/api/orders)"
          cat /tmp/orders.json
          [[ "$code" == "401" ]]
          echo "Customer auth guard OK"
