name: GULI Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

env:
  FRONTEND_URL: https://vite-react-seven-inky-10.vercel.app
  GATEWAY_URL: https://guli-gateway.parizodabaxtiyorov.workers.dev
  BACKEND_URL: https://guli-lingerie-api.onrender.com

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Vercel storefront
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/storefront.html -w '%{http_code}' --max-time 30 "${FRONTEND_URL}/?tgapp=smoke")"
          if [[ "$code" != "200" ]]; then
            echo "Vercel storefront is not publicly reachable: HTTP $code"
            head -c 1000 /tmp/storefront.html || true
            exit 1
          fi
          grep -q '<div id="root"></div>' /tmp/storefront.html
          echo "Vercel storefront OK"

      - name: Check Render API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 "${BACKEND_URL}/api/health")"
          echo "$body"
          grep -q '"success":true' <<< "$body"
          grep -q '"status":"online"' <<< "$body"
          echo "Render health OK"

      - name: Check Cloudflare gateway health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 "${GATEWAY_URL}/api/health")"
          echo "$body"
          grep -q '"success":true' <<< "$body"
          grep -q '"gateway":"cloudflare"' <<< "$body"
          echo "Cloudflare gateway OK"

      - name: Check catalog API through gateway
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 "${GATEWAY_URL}/api/products?limit=1")"
          echo "$body" | head -c 2000
          grep -q '"success":true' <<< "$body"
          grep -q '"data":\[' <<< "$body"
          echo "Gateway catalog OK"

      - name: Check category settings API through gateway
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 "${GATEWAY_URL}/api/categories")"
          echo "$body" | head -c 2000
          grep -q '"success":true' <<< "$body"
          grep -q 'pinyuar' <<< "$(tr '[:upper:]' '[:lower:]' <<< "$body")"
          echo "Category settings OK"

      - name: Check protected customer endpoints reject unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/orders.json -w '%{http_code}' --max-time 30 "${GATEWAY_URL}/api/orders")"
          cat /tmp/orders.json
          [[ "$code" == "401" ]]
          echo "Customer auth guard OK"

      - name: Complete job
        if: ${{ always() }}
        shell: bash
        run: echo "Vercel/Gateway/Render production smoke checks completed; review any failed step above."

      - name: Publish production smoke commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status }}
          TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              'state': os.environ['STATE'],
              'context': 'Production Smoke',
              'description': 'GULI production smoke workflow: ' + os.environ['STATE'],
              'target_url': os.environ['TARGET'],
          }))
          PY
          curl -sS --fail \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d @/tmp/status.json
