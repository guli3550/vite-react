name: GULI Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

env:
  FRONTEND_URL: https://vite-react-seven-inky-10.vercel.app
  GATEWAY_URL: https://guli-gateway.parizodabaxtiyorov.workers.dev
  BACKEND_URL: https://guli-lingerie-api.onrender.com

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend production build
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Run frontend production build
        shell: bash
        run: bun run build

      - name: Audit canonical server boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-canonical-server.js

      - name: Check Vercel storefront
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/storefront.html -w '%{http_code}' --max-time 30 "${FRONTEND_URL}/?tgapp=smoke")"
          if [[ "$code" != "200" ]]; then
            echo "Vercel storefront is not publicly reachable: HTTP $code"
            head -c 1000 /tmp/storefront.html || true
            exit 1
          fi
          grep -q '<div id="root"></div>' /tmp/storefront.html
          echo "Vercel storefront OK"

      - name: Check Render API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 "${BACKEND_URL}/api/health")"
          echo "$body"
          grep -q '"success":true' <<< "$body"
          grep -q '"status":"online"' <<< "$body"
          echo "Render health OK"

      - name: Wait for canonical category API after deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code="$(curl -sS -o /tmp/render-categories.json -w '%{http_code}' --max-time 30 "${BACKEND_URL}/api/categories")"
            echo "Render /api/categories attempt ${attempt}: HTTP ${code}"
            head -c 2000 /tmp/render-categories.json || true
            echo
            if [[ "${code}" == "200" ]] &&                grep -q '"success":true' /tmp/render-categories.json &&                grep -q 'pinyuar' <(tr '[:upper:]' '[:lower:]' < /tmp/render-categories.json); then
              echo "Canonical Render category API is ready."
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              echo "Render deployment is still propagating; retrying in 10s..."
              sleep 10
            fi
          done
          echo "Canonical Render /api/categories did not become ready within the deployment propagation window."
          exit 1

      - name: Check Cloudflare gateway health
        shell: bash
        run: |
          set -euo pipefail
          set -x
          curl -sS --fail --max-time 30 -D /tmp/gateway-headers.txt -o /tmp/gateway-health.json "${GATEWAY_URL}/api/health"
          set +x
          echo "Gateway response headers:"
          cat /tmp/gateway-headers.txt
          echo "Gateway response body:"
          cat /tmp/gateway-health.json
          grep -q '"success":true' /tmp/gateway-health.json
          grep -q '"status":"online"' /tmp/gateway-health.json
          grep -qi '^x-guli-gateway:[[:space:]]*cloudflare-proxy' /tmp/gateway-headers.txt
          grep -qi '^x-guli-canonical-upstream:[[:space:]]*guli-api' /tmp/gateway-headers.txt
          echo "Cloudflare proxy gateway OK"

      - name: Check catalog API through gateway
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 "${GATEWAY_URL}/api/products?limit=1")"
          echo "$body" | head -c 2000
          grep -q '"success":true' <<< "$body"
          grep -q '"data":[' <<< "$body"
          echo "Gateway catalog OK"

      - name: Check category settings API through gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            gateway_code="$(curl -sS -o /tmp/gateway-categories.json -w '%{http_code}' --max-time 30 "${GATEWAY_URL}/api/categories")"
            echo "Gateway /api/categories attempt ${attempt}: HTTP ${gateway_code}"
            head -c 2000 /tmp/gateway-categories.json || true
            echo
            if [[ "${gateway_code}" == "200" ]] &&                grep -q '"success":true' /tmp/gateway-categories.json &&                grep -q 'pinyuar' <(tr '[:upper:]' '[:lower:]' < /tmp/gateway-categories.json); then
              echo "Cloudflare gateway category settings OK"
              exit 0
            fi
            if [[ "${attempt}" -lt 6 ]]; then
              echo "Gateway/backend propagation still in progress; retrying in 10s..."
              sleep 10
            fi
          done
          echo "Cloudflare gateway does not expose the canonical /api/categories route."
          echo "This is a real gateway deployment/configuration failure, not a Render warm-up condition."
          exit 1

      - name: Check protected customer endpoints reject unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            code="$(curl -sS -o /tmp/orders.json -w '%{http_code}' --max-time 30 "${GATEWAY_URL}/api/orders")"
            echo "Customer order auth check attempt ${attempt}: HTTP ${code}"
            cat /tmp/orders.json
            if [[ "${code}" == "401" ]]; then
              echo "Customer auth guard OK"
              exit 0
            fi
            if [[ "${attempt}" -lt 12 ]]; then
              echo "Backend deployment may still be propagating; retrying in 10s..."
              sleep 10
            fi
          done
          echo "Customer auth guard did not reach HTTP 401 after deployment propagation window."
          exit 1

      - name: Check authenticated card checkout routes are mounted and protected
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/auth-order.json -w '%{http_code}' --max-time 30             -X POST -H 'Content-Type: application/json'             -d '{}' "${BACKEND_URL}/api/auth/orders")"
          cat /tmp/auth-order.json
          [[ "$code" == "401" ]]

          code="$(curl -sS -o /tmp/auth-card.json -w '%{http_code}' --max-time 30             "${BACKEND_URL}/api/auth/payment/card-info")"
          cat /tmp/auth-card.json
          [[ "$code" == "401" ]]
          echo "Authenticated card checkout routes OK"

      - name: Complete job
        if: ${{ always() }}
        shell: bash
        run: echo "Vercel/Gateway/Render production smoke checks completed; review any failed step above."

      - name: Publish production smoke commit status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status }}
          TARGET: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              'state': os.environ['STATE'],
              'context': 'Production Smoke',
              'description': 'GULI production smoke workflow: ' + os.environ['STATE'],
              'target_url': os.environ['TARGET'],
          }))
          PY
          curl -sS --fail             -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"             -d @/tmp/status.json
