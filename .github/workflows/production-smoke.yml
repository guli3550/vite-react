name: GULI Production Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check canonical Vercel storefront
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o /tmp/storefront.html -w '%{http_code}' --max-time 30 'https://vite-react-seven-inky-10.vercel.app/?tgapp=smoke')"
          if [[ "$code" != "200" ]]; then
            echo "Vercel storefront is not publicly reachable: HTTP $code"
            head -c 1000 /tmp/storefront.html || true
            exit 1
          fi
          grep -q '<div id="root"></div>' /tmp/storefront.html
          echo "Vercel storefront OK"

      - name: Check Render API health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 https://guli-lingerie-api.onrender.com/api/health)"
          echo "$body"
          grep -q '"success":true' <<< "$body"
          grep -q '"status":"online"' <<< "$body"
          echo "Render health OK"

      - name: Check Vercel API rewrite to Render
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 https://vite-react-seven-inky-10.vercel.app/api/health)"
          echo "$body"
          grep -q '"success":true' <<< "$body"
          grep -q '"status":"online"' <<< "$body"
          echo "Vercel API rewrite OK"

      - name: Check Cloudflare gateway health
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 https://guli-gateway.parizodabaxtiyorov.workers.dev/api/health)"
          echo "$body"
          grep -q '"success":true' <<< "$body"
          grep -q '"gateway":"cloudflare"' <<< "$body"
          echo "Cloudflare gateway OK"

      - name: Check catalog API through gateway
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 'https://guli-gateway.parizodabaxtiyorov.workers.dev/api/products?limit=1')"
          echo "$body" | head -c 2000
          grep -q '"success":true' <<< "$body"
          grep -q '"data":\[' <<< "$body"
          echo "Gateway catalog OK"

      - name: Check category settings API through gateway
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS --fail --max-time 30 'https://guli-gateway.parizodabaxtiyorov.workers.dev/api/categories')"
          echo "$body" | head -c 2000
          grep -q '"success":true' <<< "$body"
          grep -q 'pinyuar' <<< "$(tr '[:upper:]' '[:lower:]' <<< "$body")"
          echo "Category settings OK"

      - name: Check protected customer endpoints reject unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/orders.json -w '%{http_code}' --max-time 30 https://guli-gateway.parizodabaxtiyorov.workers.dev/api/orders)"
          cat /tmp/orders.json
          [[ "$code" == "401" ]]
          echo "Customer auth guard OK"

      - name: Complete job
        if: ${{ always() }}
        shell: bash
        run: echo "Vercel/Render/Gateway production smoke checks completed; review any failed step above."
