services:
  - type: web
    name: guli-lingerie-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node customerServer.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CARD_PAYMENT_NUMBER
        sync: false
      - key: CARD_PAYMENT_NAME
        sync: false
