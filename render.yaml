services:
  - type: web
    name: guli-lingerie-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        value: https://guli-lingerie-web.onrender.com/
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: CARD_PAYMENT_NUMBER
        sync: false
      - key: CARD_PAYMENT_NAME
        sync: false

  - type: static
    name: guli-lingerie-web
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
